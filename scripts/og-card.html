<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Payment Splitter OG card</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #ffffff;
        color: #111827;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      .card {
        width: 1200px;
        height: 630px;
        padding: 72px 80px 80px;
        display: flex;
        flex-direction: column;
        position: relative;
        background: #ffffff;
      }

      .path {
        font-size: 22px;
        font-weight: 500;
        color: #9ca3af;
        letter-spacing: -0.01em;
      }

      .main {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 48px;
        min-height: 0;
      }

      .copy {
        min-width: 0;
      }

      h1 {
        font-size: 64px;
        font-weight: 700;
        letter-spacing: -0.035em;
        line-height: 1.05;
        margin: 18px 0 16px;
      }

      .tagline {
        font-size: 28px;
        line-height: 1.35;
        color: #4b5563;
        max-width: 640px;
      }

      .meta {
        display: flex;
        flex-wrap: wrap;
        gap: 10px 22px;
        margin-top: 28px;
        font-size: 22px;
        color: #6b7280;
      }

      .meta span {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #d1d5db;
      }

      .icon {
        width: 220px;
        height: 220px;
        flex-shrink: 0;
        border-radius: 36px;
        overflow: hidden;
        background: #111827;
        display: grid;
        place-items: center;
      }

      .icon svg {
        width: 148px;
        height: 148px;
        display: block;
      }

      .footer {
        display: flex;
        align-items: center;
        gap: 14px;
        font-size: 22px;
        color: #4b5563;
      }

      .frog {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: #111827;
        color: #ffffff;
        display: grid;
        place-items: center;
        font-size: 22px;
        line-height: 1;
      }

      .bar {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 8px;
        background: linear-gradient(90deg, #111827 0%, #4b5563 50%, #d1d5db 100%);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <p class="path">ryazlee.github.io/payment-splitter</p>
      <div class="main">
        <div class="copy">
          <h1>Payment Splitter</h1>
          <p class="tagline">Split the bill without the spreadsheet or an app.</p>
          <div class="meta">
            <span>Scan a receipt</span>
            <span class="dot"></span>
            <span>Split the shares</span>
            <span class="dot"></span>
            <span>Send Venmo links</span>
          </div>
        </div>
        <div class="icon" aria-hidden="true">
          <svg viewBox="0 0 64 64" fill="none">
            <path
              d="M14 8h28l8 8v28.5c0 .6-.2 1.1-.7 1.5l-5.3 4.2c-.9.7-2.2.7-3.1 0l-4.2-3.3-4.2 3.3c-.9.7-2.2.7-3.1 0l-4.2-3.3-4.2 3.3c-.9.7-2.2.7-3.1 0l-4.2-3.3-4.2 3.3c-.5.4-1.2.4-1.7 0-.5-.4-.8-.9-.8-1.5V8z"
              fill="#e5e7eb"
            />
            <path d="M42 8v8h8" fill="#d1d5db" />
            <rect x="20" y="16" width="24" height="4" rx="1.5" fill="#111827" />
            <path
              d="M20 26h8M36 26h8M20 31h8M36 31h8M20 36h8M36 36h8"
              stroke="#111827"
              stroke-width="2.2"
              stroke-linecap="round"
            />
            <text
              x="40"
              y="50"
              text-anchor="middle"
              font-size="14"
              font-weight="700"
              font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
              fill="#111827"
            >
              $
            </text>
          </svg>
        </div>
      </div>
      <div class="footer">
        <span class="frog">🐸</span>
        <span>made by @ryab</span>
      </div>
      <div class="bar"></div>
    </div>
  </body>
</html>
