<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fafafa" />
    <meta name="description" content="Split the bill without the spreadsheet or an app." />
    <meta property="og:title" content="Payment Splitter" />
    <meta property="og:description" content="Split the bill without the spreadsheet or an app." />
    <meta property="og:site_name" content="Payment Splitter" />
    <meta property="og:image" content="https://ryazlee.github.io/payment-splitter/og.png" />
    <meta property="og:image:alt" content="Payment Splitter — split the bill without the spreadsheet or an app." />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Payment Splitter" />
    <meta name="twitter:description" content="Split the bill without the spreadsheet or an app." />
    <meta name="twitter:image" content="https://ryazlee.github.io/payment-splitter/og.png" />
    <title>Payment Splitter</title>
    <script>
      try {
        var saved = localStorage.getItem('payment-splitter-theme')
        var dark =
          saved === 'dark' ||
          (saved !== 'light' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) {
          document.documentElement.classList.add('theme-dark')
          document
            .querySelector('meta[name="theme-color"]')
            ?.setAttribute('content', '#09090b')
        }
      } catch (e) {}
    </script>
    <script>
      // SPA: we'll send the first pageview ourselves after React mounts.
      window.goatcounter = { no_onload: true }
    </script>
    <script
      data-goatcounter="https://ryab.goatcounter.com/count"
      async
      src="https://gc.zgo.at/count.js"
    ></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
